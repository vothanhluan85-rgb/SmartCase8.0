window.local_formatDateVN = function(dateStr) {
  if (!dateStr) return "---";
  var d = new Date(dateStr);
  if (isNaN(d.getTime())) return "---";
  return ("0" + d.getDate()).slice(-2) + "/" + ("0" + (d.getMonth() + 1)).slice(-2) + "/" + d.getFullYear();
};

window.local_toVNText = function(dateStr, isCap) {
  if (!dateStr) return isCap ? "Ngày... tháng... năm..." : "ngày... tháng... năm...";
  var d = new Date(dateStr);
  if (isNaN(d.getTime())) return isCap ? "Ngày... tháng... năm..." : "ngày... tháng... năm...";
  var ngay = ("0" + d.getDate()).slice(-2);
  var thang = ("0" + (d.getMonth() + 1)).slice(-2);
  var nam = d.getFullYear();
  return (isCap ? "Ngày " : "ngày ") + ngay + " tháng " + thang + " năm " + nam;
};

window.local_fmtFullTime = function(dateStr, timeStr) {
  if (!dateStr || !timeStr) return ".......giờ.......phút, ngày.......tháng.......năm.......";
  var t = String(timeStr).split(":");
  var hh = ("0" + (t[0] || "00")).slice(-2);
  var mm = ("0" + (t[1] || "00")).slice(-2);
  return hh + " giờ " + mm + " phút, " + window.local_toVNText(dateStr, false);
};

window.local_toTitleCase = function(str) {
  if (!str) return "";
  var words = String(str).trim().split(/\s+/);
  var keepUpper = [
    "TMCP", "TNHH", "CP", "MTV", "UBND", "TAND", "VKSND", "VN", "JSC", "BHTG", 
    "HTX", "NHCSXH", "NHTMCP", "NH", "BIDV", "ACB", "MB", "VPBANK", "VIETINBANK", 
    "VIETCOMBANK", "AGRIBANK", "SHB", "TPBANK", "HDBANK", "VIB", "MSB", "OCB", 
    "SEABANK", "LPBANK", "SCB", "SACOMBANK", "ABBANK", "BAB", "NCB", "QLTA"
  ];
  return words.map(function(w) {
    var upperW = w.toUpperCase();
    if (keepUpper.includes(upperW)) return upperW;
    if (w.includes("'") || w.includes("’")) {
      var parts = w.split(/['’]/);
      return parts.map(function(p) {
        if (!p) return "";
        return p.charAt(0).toUpperCase() + p.slice(1).toLowerCase();
      }).join("'");
    }
    return upperW.charAt(0) + w.slice(1).toLowerCase();
  }).join(" ");
};

window.cleanHonorificFromName = function(name) {
  if (!name) return "";
  return String(name).replace(/^(Ông|Bà|Anh|Chị|Cháu|ông|bà|anh|chị|cháu)\s+/i, '').trim();
};

window.isIndividualHonorific = function(xh) {
  if (!xh) return false;
  var x = String(xh).trim().toLowerCase();
  if (x === "tổ chức" || x === "pháp nhân" || x === "công ty" || x === "doanh nghiệp" || x === "ubnd" || x === "ngân hàng" || x === "chi nhánh") return false;
  return (x === "ông" || x === "bà" || x === "anh" || x === "chị" || x === "cháu" || x === "ông/bà");
};

window.getSafeHonorific = function(m, defaultXh) {
  if (!m) return defaultXh || "ông/bà";
  var rawXh = String(m.xungHo || m.title || "").trim();
  if (!rawXh || rawXh.toLowerCase() === "ông/bà") {
    return defaultXh || "ông/bà";
  }
  if (!window.isIndividualHonorific(rawXh)) return "";
  return rawXh.toLowerCase();
};

window.local_formatPhoneNumber = function(phone) {
  if (!phone) return "";
  let str = String(phone).trim().replace(/[^0-9+]/g, '');
  if (str.length > 0 && str.charAt(0) !== '0' && str.charAt(0) !== '+') str = '0' + str;
  return str;
};

window.formatPhoneVNInput = function(input) {
  if (!input) return;
  let val = input.value.replace(/\D/g, '');
  if (val.length > 10) val = val.substring(0, 10);
  let formatted = val;
  if (val.length > 7) formatted = val.substring(0, 4) + '.' + val.substring(4, 7) + '.' + val.substring(7);
  else if (val.length > 4) formatted = val.substring(0, 4) + '.' + val.substring(4);
  input.value = formatted;
};

window.local_numberToWordsVi = function(so) {
  if (so === 0 || so === "0" || so === "") return "Không đồng";
  so = parseInt(String(so).replace(/[^\d]/g, ''), 10);
  if (isNaN(so) || so === 0) return "Không đồng";

  var chuSo = ["không", "một", "hai", "ba", "bốn", "năm", "sáu", "bảy", "tám", "chín"];
  var donVi = ["", "nghìn", "triệu", "tỷ", "nghìn tỷ", "triệu tỷ"];
  var numStr = String(so);
  var blocks = [];

  while (numStr.length > 0) {
    blocks.push(numStr.slice(-3));
    numStr = numStr.slice(0, -3);
  }

  var str = "";
  for (var i = 0; i < blocks.length; i++) {
    var blockStr = blocks[i];
    var val = parseInt(blockStr, 10);
    if (val > 0) {
      var isHighest = (i === blocks.length - 1);
      if (!isHighest) { while (blockStr.length < 3) blockStr = "0" + blockStr; }
      var tram = blockStr.length === 3 ? parseInt(blockStr[0]) : -1;
      var chuc = blockStr.length >= 2 ? parseInt(blockStr[blockStr.length - 2]) : 0;
      if (blockStr.length === 1) chuc = -1;
      var donvi = parseInt(blockStr[blockStr.length - 1]);
      var kq = "";
      if (tram !== -1) kq += chuSo[tram] + " trăm ";
      if (chuc > 1) {
        kq += chuSo[chuc] + " mươi ";
        if (donvi === 1) kq += "mốt"; else if (donvi === 5) kq += "lăm"; else if (donvi > 0) kq += chuSo[donvi];
      } else if (chuc === 1) {
        kq += "mười ";
        if (donvi === 5) kq += "lăm"; else if (donvi > 0) kq += chuSo[donvi];
      } else if (chuc === 0) {
        if (donvi > 0) { if (tram !== -1) kq += "lẻ "; kq += chuSo[donvi]; }
      } else { kq += chuSo[donvi]; }
      str = kq.trim() + " " + donVi[i] + " " + str;
    }
  }
  return str.replace(/\s+/g, " ").trim().charAt(0).toUpperCase() + str.replace(/\s+/g, " ").trim().slice(1) + " đồng";
};

window.local_calculateCourtFee = function(loaiAn, giaTriRaw) {
  var fee = 0; var tamUng = 0;
  if (loaiAn === 'hinhSu') { fee = 200000; tamUng = 0; }
  else if (loaiAn === 'hanhChinh') { fee = 300000; tamUng = 300000; }
  else {
    var giaTri = parseInt(String(giaTriRaw).replace(/[^\d]/g, '')) || 0;
    var isKDTM = (loaiAn === 'kinhDoanh');
    var noPriceFee = isKDTM ? 3000000 : 300000;

    if (giaTri <= 0) { fee = noPriceFee; }
    else {
      if (giaTri <= 6000000) fee = 300000;
      else if (giaTri <= 400000000) fee = isKDTM ? (3000000 + (giaTri - 6000000) * 0.05) : (giaTri * 0.05);
      else if (giaTri <= 800000000) fee = (isKDTM ? 22700000 : 20000000) + (giaTri - 400000000) * 0.04;
      else if (giaTri <= 2000000000) fee = (isKDTM ? 38700000 : 36000000) + (giaTri - 800000000) * 0.03;
      else if (giaTri <= 4000000000) fee = (isKDTM ? 74700000 : 72000000) + (giaTri - 2000000000) * 0.02;
      else fee = (isKDTM ? 114700000 : 112000000) + (giaTri - 4000000000) * 0.001;
    }
    fee = Math.round(fee); tamUng = fee * 0.5;
    if (tamUng < noPriceFee) tamUng = noPriceFee;
    if (giaTri === 0) tamUng = fee;
  }
  return {
    anPhiSo: fee.toLocaleString('vi-VN'), anPhiChu: window.local_numberToWordsVi(fee),
    tamUngSo: Math.round(tamUng).toLocaleString('vi-VN'), tamUngChu: window.local_numberToWordsVi(Math.round(tamUng))
  };
};

window.validateDonData = function(parties) {
  let warnings = [];
  let quanHeEl = document.getElementById('don_quanHe');
  let quanHe = quanHeEl ? quanHeEl.value.trim() : "";
  if (!quanHe || quanHe === "Tranh chấp / Yêu cầu theo đơn" || quanHe === "---") {
    warnings.push("- Chưa phân loại Quan hệ tranh chấp / Tội danh cụ thể.");
  }

  let missingDob = false;
  (parties || []).forEach(p => {
    if (p.xungHo !== "Tổ chức" && !p.namSinh) missingDob = true;
  });

  if (missingDob) warnings.push("- Có đương sự cá nhân chưa điền Năm sinh.");

  if (warnings.length > 0) {
    return "CẢNH BÁO THIẾU THÔNG TIN:\n" + warnings.join("\n") + "\n\nBạn có muốn tiếp tục xử lý không?";
  }
  return null;
};

window.calculateDonFee = function() {
  var loaiAnEl = document.getElementById('don_loaiAn');
  var valEl = document.getElementById('don_giaTri');
  if (!loaiAnEl || !valEl) return;

  window.updateQuanHeDatalist();

  var loaiAn = loaiAnEl.value;
  var val = valEl.value;
  var key = "danSu";
  if (loaiAn.includes("Kinh doanh")) key = "kinhDoanh";
  else if (loaiAn.includes("Hình sự")) key = "hinhSu";
  else if (loaiAn.includes("Hành chính")) key = "hanhChinh";

  var res = window.local_calculateCourtFee(key, val);

  window.setValueSafe('don_res_anPhi', res.anPhiSo);
  let chu1 = document.getElementById('don_res_anPhi_chu');
  if (chu1) chu1.innerText = "(" + res.anPhiChu + ")";

  window.setValueSafe('don_res_tamUng', res.tamUngSo);
  let chu2 = document.getElementById('don_res_tamUng_chu');
  if (chu2) chu2.innerText = "(" + res.tamUngChu + ")";

  window.setValueSafe('don_tamUngValue', res.tamUngSo.replace(/\./g, ''));
};

window.moChiTietDon = function(idDon) {
  if (!idDon) return;
  let donRAM = typeof G_Don !== 'undefined' ? G_Don.find(d => d.id === idDon) : null;

  if (donRAM) {
    window.setValueSafe('don_id', donRAM.id);
    window.setValueSafe('don_soDon', donRAM.soDon);
    
    let elSoDon = document.getElementById('don_soDon');
    let elNgayNhan = document.getElementById('don_ngayNhan');
    if (elSoDon) { elSoDon.readOnly = true; elSoDon.classList.add('bg-light', 'text-muted'); }
    if (elNgayNhan) { elNgayNhan.readOnly = true; elNgayNhan.classList.add('bg-light', 'text-muted'); elNgayNhan.style.pointerEvents = 'none'; }

    window.setValueSafe('don_loaiAn', donRAM.loaiAn || "2. Dân sự");
    window.updateQuanHeDatalist();
    window.setValueSafe('don_quanHe', donRAM.quanHe);
    window.setValueSafe('don_thamPhan', donRAM.thamPhan);

    window.setValueSafe('don_ngayNhan', window.formatDateToYMD(donRAM.rawDate));
    window.setValueSafe('don_process_ngayBanHanh', window.formatDateToYMD());

    window.setValueSafe('don_giaTri', String(donRAM.giaTri || "0").replace(/\B(?=(\d{3})+(?!\d))/g, "."));
    window.setValueSafe('don_tamUngValue', donRAM.tamUng || "0");

    let ghiChuVal = String(donRAM.ghiChu || "").trim();
    if (ghiChuVal === "Đồng bộ từ Sổ gốc") ghiChuVal = "";
    window.setValueSafe('don_ghiChu', ghiChuVal);

    var cardNote = document.getElementById('don_ghiChu_card');
    if (ghiChuVal !== "") { if (cardNote) { cardNote.classList.remove('note-empty'); cardNote.classList.add('note-filled'); } } 
    else { if (cardNote) { cardNote.classList.remove('note-filled'); cardNote.classList.add('note-empty'); } }

    if (document.getElementById('don_trangThai_display')) document.getElementById('don_trangThai_display').value = donRAM.trangThai || "Chưa xử lý";
    if (document.getElementById('don_res_tamUng')) document.getElementById('don_res_tamUng').value = String(donRAM.tamUng || "0").replace(/\B(?=(\d{3})+(?!\d))/g, ".");

    let ht = document.getElementById('don_header_title');
    if (ht) ht.innerHTML = "CHI TIẾT HỒ SƠ ĐƠN";

    ['nkk', 'nbk', 'nlq'].forEach(t => { let el = document.getElementById('don-party-list-' + t); if(el) el.innerHTML = ""; });

    var sec = document.getElementById('nlq-section');
    if (sec) sec.style.display = 'none';

    if (donRAM.chiTietDuongSu && donRAM.chiTietDuongSu.length > 0) {
      let groups = [];
      donRAM.chiTietDuongSu.forEach(d => {
        let roleLower = String(d.tuCach || "").toLowerCase();
        let type = '';
        if (roleLower.includes('khởi kiện') || roleLower.includes('yêu cầu') || roleLower.includes('bị hại') || roleLower.includes('nguyên đơn')) type = 'NKK';
        else if (roleLower.includes('liên quan')) type = 'NLQ';
        else type = 'NBK';

        // CHUẨN HÓA: Gom nhóm cùng địa chỉ chỉ dựa vào diaChi
        let addrKey = (d.diaChi || "").trim().toLowerCase();
        let found = addrKey ? groups.find(g => g.type === type && (g.diaChi || "").trim().toLowerCase() === addrKey) : null;
        if (found) { 
          found.members.push(d); 
        } else { 
          groups.push({ type: type, diaChi: d.diaChi || "", sdt: d.sdt || "", cccd: d.cccd || "", members: [d] }); 
        }
      });

      groups.forEach(g => {
        window.addPartyGroupV76(g.type, g.members);
        if (g.type === 'NLQ' && sec) sec.style.display = 'block';
      });
    }

    let nkkList = document.getElementById('don-party-list-nkk');
    let nbkList = document.getElementById('don-party-list-nbk');

    if (nkkList && nkkList.innerHTML.trim() === "") window.addPartyGroupV76('NKK');
    if (nbkList && nbkList.innerHTML.trim() === "") window.addPartyGroupV76('NBK');

    window.CURRENT_APP_CONTEXT = {
      scope: "DON",
      caseInfo: null,
      caseParties: [],
      donInfo: donRAM
    };
    if (typeof window.updateCopilotScopeBadge === 'function') {
      window.updateCopilotScopeBadge();
    }

    window.loadDonTemplatesForSelect();
    appNavigate('view-chi-tiet-don');
  } else { 
    AppUI.alert("Lỗi", "Không tìm thấy dữ liệu đơn trong bộ nhớ tạm."); 
  }
};

window.loadDanhSachDon = function(isForceRefresh) {
  var tbody = document.getElementById('don-list-data');
  if (tbody && isForceRefresh) {
    tbody.innerHTML = '<tr><td colspan="7" class="text-center p-5"><div class="spinner-border text-primary me-2"></div><span class="text-muted fw-bold">Đang tải Sổ nhận đơn...</span></td></tr>';
  }

  var donStartEl = document.getElementById('don_filter_start');
  var donEndEl = document.getElementById('don_filter_end');
  
  var sTimeTs = (donStartEl && donStartEl.value) ? new Date(donStartEl.value).getTime() : null;
  var eTimeTs = (donEndEl && donEndEl.value) ? new Date(donEndEl.value).getTime() + 86399999 : null;

  google.script.run
    .withSuccessHandler(function(data) {
      if (data && data.error) {
        if (tbody) tbody.innerHTML = '<tr><td colspan="7" class="text-center p-5 text-danger">LỖI DATA: ' + data.error + '</td></tr>';
        return;
      }
      G_Don = data || [];
      window.requestAnimationFrame(function() { window.runFilterDonEngine(true); });
    })
    .withFailureHandler(function(err) {
      if (tbody) tbody.innerHTML = '<tr><td colspan="7" class="text-center p-5 text-danger">LỖI MẠNG: Không thể tải sổ đơn: ' + err.message + '</td></tr>';
    })
    .api_LayDanhSachDon(sTimeTs, eTimeTs);
};

window.triggerDonSearch = function() {
  clearTimeout(window.searchDonTimeout);
  window.searchDonTimeout = setTimeout(function() { window.runFilterDonEngine(); }, 300);
};

window.runFilterDonEngine = function(isFromLoad = false) {
  if (!isFromLoad && typeof event !== 'undefined' && event && event.target && (event.target.id === 'don_filter_start' || event.target.id === 'don_filter_end')) {
    window.loadDanhSachDon(true);
    return; 
  }

  if (!G_Don || G_Don.length === 0) {
    if (typeof window.renderDonTable === 'function') window.renderDonTable([]);
    return;
  }

  var donSearchEl = document.getElementById('don_txtSearch');
  var q = donSearchEl ? (window.removeAccents ? window.removeAccents(String(donSearchEl.value).toLowerCase().trim()) : String(donSearchEl.value).toLowerCase().trim()) : "";
  var currentTab = window.currentDonStatusTab || 'ALL';
  
  var displayList = [];

  for (var i = 0; i < G_Don.length; i++) {
    var don = G_Don[i];
    var ttLower = String(don.trangThai || "").toLowerCase();

    if (currentTab !== 'ALL') {
      if (currentTab === 'CHUA_XU_LY' && !(ttLower === 'chưa xử lý' || ttLower === 'đang xem xét' || ttLower === '')) continue;
      if (currentTab === 'BO_SUNG' && !ttLower.includes('bổ sung') && !ttLower.includes('sửa đổi')) continue;
      if (currentTab === 'DA_HEN_SMS' && !ttLower.includes('hẹn') && !ttLower.includes('sms')) continue;
      if (currentTab === 'HGDT' && !ttLower.includes('hòa giải') && !ttLower.includes('đối thoại')) continue;
      if (currentTab === 'DA_THU_LY' && !ttLower.includes('thụ lý')) continue;
      if (currentTab === 'DA_XONG' && !ttLower.includes('xong') && !ttLower.includes('trả lại') && !ttLower.includes('chuyển đơn')) continue;
    }

    if (q) {
      var strSoDon = window.removeAccents ? window.removeAccents(String(don.soDon || "").toLowerCase()) : String(don.soDon || "").toLowerCase();
      var strNKK = window.removeAccents ? window.removeAccents(String(don.nguoiKhoiKien || "").toLowerCase()) : String(don.nguoiKhoiKien || "").toLowerCase();
      var strNBK = window.removeAccents ? window.removeAccents(String(don.nguoiBiKien || "").toLowerCase()) : String(don.nguoiBiKien || "").toLowerCase();
      var strQH = window.removeAccents ? window.removeAccents(String(don.quanHe || "").toLowerCase()) : String(don.quanHe || "").toLowerCase();
      var strTP = window.removeAccents ? window.removeAccents(String(don.thamPhan || "").toLowerCase()) : String(don.thamPhan || "").toLowerCase();

      if (strSoDon.indexOf(q) === -1 && strNKK.indexOf(q) === -1 && strNBK.indexOf(q) === -1 && strQH.indexOf(q) === -1 && strTP.indexOf(q) === -1) {
        continue;
      }
    }

    displayList.push(don);
  }

  if (typeof window.renderDonTable === 'function') window.renderDonTable(displayList);
};

window.renderDonTable = function(data) {
  var tbody = document.getElementById('don-list-data');
  if (!tbody) return;
  if (!data || data.length === 0) {
    tbody.innerHTML = "<tr><td colspan='7' class='text-center p-5 text-muted small'><i class='fas fa-box-open fa-2x mb-2 d-block opacity-50'></i>Không có dữ liệu đơn phù hợp với bộ lọc.</td></tr>";
    return;
  }

  var totalData = data.length;
  var htmlRows = [];

  data.slice(0, 100).forEach(function(don) {
    try {
      var badgeClass = "text-secondary border-secondary";
      var tt = String(don.trangThai || "").toLowerCase();

      if (tt.includes("đã thụ lý")) badgeClass = "text-success border-success bg-success-subtle";
      else if (tt.includes("đang xem xét") || tt.includes("chờ ra") || tt.includes("báo xử lý")) badgeClass = "text-primary border-primary bg-primary-subtle";
      else if (tt.includes("hẹn làm việc") || tt.includes("sms") || tt.includes("hướng dẫn")) badgeClass = "text-info border-info bg-info-subtle";
      else if (tt.includes("chuyển hòa giải đối thoại") || tt.includes("lựa chọn hòa giải")) badgeClass = "text-info border-info bg-info-subtle";
      else if (tt.includes("trả lại") || tt.includes("chuyển đơn")) badgeClass = "text-dark border-dark bg-dark-subtle";
      else if (tt.includes("bổ sung") || tt.includes("làm rõ")) badgeClass = "text-warning-emphasis border-warning bg-warning-subtle";
      else if (tt.includes("đã xử lý xong")) badgeClass = "text-success border-success bg-success-subtle";

      var warningStyle = "border-left: 4px solid #0dcaf0;";
      if (!tt.includes("thụ lý") && !tt.includes("trả") && !tt.includes("chuyển") && !tt.includes("xử lý xong") && !tt.includes("hòa giải")) {
        if (((new Date().getTime() - don.rawDate) / 86400000) >= 8) warningStyle = "border-left: 4px solid #ef4444;";
      }

      let nkkHtml = "---", nbkHtml = "---";
      if (don.chiTietDuongSu && don.chiTietDuongSu.length > 0) {
        let nkks = don.chiTietDuongSu.filter(d => {
          let tc = String(d.tuCach || "").toLowerCase();
          return tc.includes('khởi kiện') || tc.includes('yêu cầu') || tc.includes('bị hại') || tc.includes('nguyên đơn');
        });
        let nbks = don.chiTietDuongSu.filter(d => {
          let tc = String(d.tuCach || "").toLowerCase();
          return tc.includes('bị kiện') || tc.includes('bị cáo') || tc.includes('bị đơn');
        });

        nkkHtml = nkks.map(d => `<div class="fw-bold text-danger" style="font-size:12px;">${d.hoTen || 'Chưa rõ'}</div><div class="text-muted mt-1" style="font-size:10px; line-height:1.4;">${d.namSinh ? 'SN: '+d.namSinh+'<br>' : ''}${d.diaChi || ''}${d.sdt ? '<br><i class="fas fa-phone-alt me-1"></i>'+window.local_formatPhoneNumber(d.sdt) : ''}</div>`).join('<hr class="my-2 border-secondary" style="opacity: 0.2">');
        nbkHtml = nbks.map(d => `<div class="fw-bold text-dark" style="font-size:12px;">${d.hoTen || 'Chưa rõ'}</div><div class="text-muted mt-1" style="font-size:10px; line-height:1.4;">${d.namSinh ? 'SN: '+d.namSinh+'<br>' : ''}${d.diaChi || ''}${d.sdt ? '<br><i class="fas fa-phone-alt me-1"></i>'+window.local_formatPhoneNumber(d.sdt) : ''}</div>`).join('<hr class="my-2 border-secondary" style="opacity: 0.2">');
      } else {
        nkkHtml = `<div class="fw-bold text-danger" style="font-size: 12px;">${don.nguoiKhoiKien || '---'}</div>`;
        nbkHtml = `<div class="fw-bold text-dark" style="font-size: 12px;">${don.nguoiBiKien || '---'}</div>`;

        ghiChuIcon = `<i class="fas fa-sticky-note text-warning ms-2 shadow-sm" style="cursor:pointer; font-size:13px;" title="Xem/Sửa Ghi chú" onclick="event.stopPropagation(); window.openNoteModal('${don.id}');"></i>`;
      }

      htmlRows.push(`

        <td class="ps-3 text-center" onclick="event.stopPropagation();">
          <input type="checkbox" class="form-check-input don-select-checkbox shadow-sm" value="${don.id}" onclick="window.toggleBulkDonButton()" style="cursor: pointer; width: 1.1rem; height: 1.1rem;">
        </td>
        <td class="ps-2">
          <div class="fw-bolder text-dark d-flex align-items-center" style="font-size:13px">${don.soDon || '---'} ${ghiChuIcon}</div>
          <div class="text-secondary fw-bold mt-1" style="font-size:11px;"><i class="far fa-calendar-alt me-1"></i>${don.ngayNhan}</div>
        </td>
        <td>${nkkHtml}</td>
        <td>${nbkHtml}</td>
        <td>
          <div class="text-dark fw-bold text-wrap" style="font-size: 12px; max-width: 250px;">${don.quanHe || '---'}</div>
          <div class="text-muted fst-italic mt-1" style="font-size:10px">${don.loaiAn || '---'}</div>
        </td>
        <td>
          <div class="fw-bold text-primary" style="font-size: 11px;">${don.thamPhan || 'Chưa PC'}</div>
        </td>
        <td class="text-center" onclick="event.stopPropagation();">

            <button class="btn btn-sm btn-light border shadow-sm p-1 d-flex align-items-center justify-content-center" style="width:26px; height:26px; border-radius:6px;" onclick="event.stopPropagation(); window.openQuickDraftDon('${don.id}')" title="Soạn văn bản"><i class="fas fa-file-word text-primary" style="font-size:11px;"></i></button>

            <button class="btn btn-sm btn-light border shadow-sm p-1 d-flex align-items-center justify-content-center" style="width:26px; height:26px; border-radius:6px;" onclick="event.stopPropagation(); window.openDonFolderFromList('${don.id}')" title="Mở Drive"><i class="fas fa-folder-open text-warning" style="font-size:11px;"></i></button>
          </div>
        </td>
      </tr>
      `);
    } catch (ex) {
      console.error("Lỗi vẽ dòng Đơn:", don, ex);
    }
  });

  if (totalData > 100) {
    htmlRows.push(`<tr><td colspan="7" class="text-center p-3 text-muted" style="background:#f8fafc; font-size:12px;">Đang hiển thị <b>100</b> / <b>${totalData}</b> kết quả.</td></tr>`);

};

window.luuThongTinDon = function(isAutoSave = false) {
  var p = {
    info: {
      id: document.getElementById('don_id').value,
      soDon: document.getElementById('don_soDon').value.trim(),
      ngayNhan: document.getElementById('don_ngayNhan').value,
      loaiAn: document.getElementById('don_loaiAn').value,
      quanHe: document.getElementById('don_quanHe').value.trim(),
      thamPhan: document.getElementById('don_thamPhan').value.trim() || "Chưa phân công",
      giaTri: String(document.getElementById('don_giaTri').value).replace(/\./g, ''),
      tamUng: document.getElementById('don_tamUngValue').value,
      huongXuLy: document.getElementById('don_trangThai_display').value,
      trangThai: document.getElementById('don_trangThai_display').value,
      ghiChu: document.getElementById('don_ghiChu').value.trim()
    },
    ds: []
  };

  if (!p.info.soDon) {
    if (isAutoSave) return;
    return AppUI.alert("Cảnh báo", "Vui lòng nhập Số đơn!");
  }

  var nkkArr = [], nbkArr = [];
  let oldDsMap = {};
  if (p.info.id && !p.info.id.includes("TEMP_") && typeof G_Don !== 'undefined') {
    let donHienTai = G_Don.find(d => d.id === p.info.id);
    if (donHienTai && donHienTai.chiTietDuongSu) {
      donHienTai.chiTietDuongSu.forEach(d => { oldDsMap[d.hoTen + "_" + d.tuCach] = d.daiDien || ""; });
    }
  }

  document.querySelectorAll('.don-party-group').forEach(g => {
    var tuCach = g.querySelector('.in-don-tucach').value;
    var diaChi = g.querySelector('.in-don-diachi').value.trim();
    var sdt = g.querySelector('.in-don-sdt').value.trim();
    var cccd = g.querySelector('.in-don-cccd').value.trim();

    g.querySelectorAll('.member-item').forEach(m => {
      var hoTen = m.querySelector('.in-don-hoten').value.trim();
      if (hoTen) {
        var xungHo = m.querySelector('.in-don-xungho').value;
        var namSinh = m.querySelector('.in-don-namsinh').value.trim();
        let tcLower = String(tuCach).toLowerCase();
        if (tcLower.includes('khởi kiện') || tcLower.includes('yêu cầu') || tcLower.includes('nguyên đơn')) nkkArr.push(hoTen);
        else if (!tcLower.includes('liên quan')) nbkArr.push(hoTen);

        let daiDienCu = oldDsMap[hoTen + "_" + tuCach] || "";
        p.ds.push({ tuCach: tuCach, xungHo: xungHo, hoTen: hoTen, namSinh: namSinh, diaChi: diaChi, sdt: sdt, cccd: cccd, daiDien: daiDienCu });
      }
    });
  });

  let warningMsg = window.validateDonData(p.ds);

  const proceedSave = function() {
    let isNew = !p.info.id || p.info.id.includes("TEMP_");
    if (!isAutoSave) AppUI.showToast("Đang lưu dữ liệu...", "");

    var dParts = p.info.ngayNhan.split('-');
    var dateVn = dParts.length === 3 ? (dParts[2] + "/" + dParts[1] + "/" + dParts[0]) : p.info.ngayNhan;
    var rawDateTs = new Date(p.info.ngayNhan).getTime();

    if (p.info.id && typeof G_Don !== 'undefined') {
      let index = G_Don.findIndex(function(d) { return d.id === p.info.id; });
      if (index > -1) {
        G_Don[index].soDon = p.info.soDon; G_Don[index].ngayNhan = dateVn; G_Don[index].rawDate = rawDateTs;
        G_Don[index].loaiAn = p.info.loaiAn; G_Don[index].quanHe = p.info.quanHe; G_Don[index].thamPhan = p.info.thamPhan;
        G_Don[index].trangThai = p.info.trangThai; G_Don[index].huongXuLy = p.info.huongXuLy; G_Don[index].ghiChu = p.info.ghiChu;
        G_Don[index].nguoiKhoiKien = nkkArr.join(", "); G_Don[index].nguoiBiKien = nbkArr.join(", "); G_Don[index].chiTietDuongSu = p.ds;
      }
    } else {
      p.info.id = "TEMP_" + new Date().getTime(); document.getElementById('don_id').value = p.info.id;
      G_Don.unshift({
        id: p.info.id, soDon: p.info.soDon, ngayNhan: dateVn, rawDate: rawDateTs,
        loaiAn: p.info.loaiAn, quanHe: p.info.quanHe, thamPhan: p.info.thamPhan, huongXuLy: p.info.huongXuLy, trangThai: p.info.trangThai, ghiChu: p.info.ghiChu,
        nguoiKhoiKien: nkkArr.join(", "), nguoiBiKien: nbkArr.join(", "), chiTietDuongSu: p.ds
      });
    }
    
    window.runFilterDonEngine(); 

    google.script.run
      .withSuccessHandler(function(res) {
        if (res.success) {
          if (isNew && res.idDon) {
            document.getElementById('don_id').value = res.idDon;
            let tmpIndex = G_Don.findIndex(function(d) { return d.id === p.info.id; });
            if (tmpIndex > -1) G_Don[tmpIndex].id = res.idDon; 
          }
          if (isAutoSave) {
            let indicator = document.getElementById('don_autosave_indicator');
            if (indicator) {
              indicator.innerHTML = '<i class="fas fa-check text-success me-1"></i> <span class="text-success">Đã tự động lưu</span>';
              setTimeout(() => { if (indicator) indicator.innerHTML = ''; }, 3000);
            }
          } else {
            AppUI.showToast("Lưu thành công!", "success");
          }
        } else { if (!isAutoSave) AppUI.alert("Lỗi", res.error); }
      })
      .api_LuuThongTinDon(p);
  };

  if (warningMsg && !isAutoSave) AppUI.confirm("Thiếu thông tin", warningMsg, "warning", proceedSave);
  else proceedSave();
};

window.sendQuickSMS = function(idDon) {
  let donRAM = typeof G_Don !== 'undefined' ? G_Don.find(d => d.id === idDon) : null;
  if (!donRAM || !donRAM.chiTietDuongSu) return AppUI.alert("Lỗi", "Chưa có thông tin đương sự.");

  let nkkList = (donRAM.chiTietDuongSu || []).filter(d => {
    let tc = String(d.tuCach || "").toLowerCase();
    return tc.includes('khởi kiện') || tc.includes('yêu cầu') || tc.includes('bị hại') || tc.includes('nguyên đơn');
  });

  if (nkkList.length === 0 || !nkkList[0].sdt) {
    return AppUI.alert("Thiếu số điện thoại", "Người khởi kiện chưa có SĐT! Vui lòng Mở Chi tiết để bổ sung.");
  }

  let phone = nkkList[0].sdt;
  let name = nkkList[0].hoTen;
  let xh = nkkList[0].xungHo;

  window.openFastSMSModal(idDon, phone, name, xh);
};

window.openFastSMSModal = function(idDon, phone, name, xungho) {
  let don = G_Don.find(d => d.id === idDon);
  if (!don) return AppUI.alert("Lỗi", "Không tìm thấy hồ sơ đơn.");

  document.getElementById('sms_target_id').value = idDon;
  document.getElementById('sms_target_phone').value = phone;
  document.getElementById('sms_target_name').value = (xungho && xungho !== 'Tổ chức' ? xungho + " " : "") + name;
  document.getElementById('sms_target_sodon').value = don.soDon;

  document.getElementById('sms_display_name').innerText = (xungho && xungho !== 'Tổ chức' ? xungho + " " : "") + name;
  document.getElementById('sms_display_phone').innerText = window.local_formatPhoneNumber(phone);

  if (window.smsStickyData.date) document.getElementById('sms_date').value = window.smsStickyData.date;
  document.getElementById('sms_time').value = window.smsStickyData.time;

window.executeFastSMS = function() {
  let idDon = document.getElementById('sms_target_id').value;
  let phoneRaw = document.getElementById('sms_target_phone').value;
  let fullName = document.getElementById('sms_target_name').value;
  let soDon = document.getElementById('sms_target_sodon').value;

  let date = document.getElementById('sms_date').value;
  let time = document.getElementById('sms_time').value;

  if (!date || !time) return AppUI.alert("Lỗi", "Vui lòng chọn Ngày và Giờ hẹn làm việc.");

  window.smsStickyData.date = date;
  window.smsStickyData.time = time;

  let dParts = date.split('-');
  let dateVn = dParts[2] + "/" + dParts[1] + "/" + dParts[0];

  let cleanName = window.removeAccents ? window.removeAccents(fullName) : fullName;
  let phone = window.local_formatPhoneNumber(phoneRaw);

  let donIdx = G_Don.findIndex(d => d.id === idDon);
  let ngayNhanDon = donIdx > -1 ? G_Don[donIdx].ngayNhan : "";

  let msg = `TAND Khu vuc 2 - Lam Dong thong bao: Da nhan don cua ${cleanName} (So don: ${soDon}${ngayNhanDon ? " - " + ngayNhanDon : ""}). Vui long lien he To Hanh chinh tu phap - Van phong Toa an ${time} ngay ${dateVn} de duoc huong dan. Luu y: He thong khong nhan cuoc goi hoac tin nhan phan hoi.`;

  let linkSms = "sms:" + phone + "?body=" + encodeURIComponent(msg);
  let a = document.createElement('a');
  a.href = linkSms;
  a.target = "_top";
  document.body.appendChild(a);
  a.click();
  setTimeout(() => document.body.removeChild(a), 1000);

  let m = bootstrap.Modal.getInstance(document.getElementById('modalFastSMS'));
  if (m) m.hide();

  if (donIdx > -1) {
    G_Don[donIdx].trangThai = "Đã hẹn làm việc";
    window.runFilterDonEngine();
    
    let statusSelect = document.getElementById('don_trangThai_display');
    if (statusSelect && document.getElementById('don_id').value === idDon) {
      statusSelect.value = "Đã hẹn làm việc";
    }

    let payloadUpdate = {
      info: Object.assign({}, G_Don[donIdx], { id: idDon, trangThai: "Đã hẹn làm việc" }),
      ds: G_Don[donIdx].chiTietDuongSu
    };
    google.script.run.api_LuuThongTinDon(payloadUpdate);
  }

  let lichContent = `Hẹn làm việc xử lý đơn khởi kiện\nSố đơn: ${soDon}\nĐương sự: ${fullName}\nSĐT: ${phone}\nPhòng số 1 - VP Tòa án`;
  google.script.run.api_LuuLichMoi_Logic({ idVuAn: "GENERAL", ngay: date, gio: time, noiDung: lichContent });
};

window.executeBulkDonAction = function() {

  if (!date || !time) return AppUI.alert("Thiếu thông tin", "Vui lòng chọn Ngày và Giờ hẹn làm việc!");

  var danhSachDonStr = window.bulkSelectedDons.map(d => "- " + d.soDon + ": " + d.nguoiKhoiKien).join("\n");
  let lichContent = "Hẹn làm việc xử lý đơn khởi kiện\nĐịa điểm: " + loc + "\nDanh sách:\n" + danhSachDonStr;

  let m = bootstrap.Modal.getInstance(document.getElementById('modalBulkActionDon'));
  if (m) m.hide();

  AppUI.showToast("Đang đồng bộ Dữ liệu & Lịch công tác...", "");

  let buttonsHtml = "";
  let payloadsForServer = [];

  window.bulkSelectedDons.forEach(don => {
    let donToUpdate = JSON.parse(JSON.stringify(don));
    donToUpdate.trangThai = "Đã hẹn làm việc";
    payloadsForServer.push({
      info: donToUpdate,
      ds: donToUpdate.chiTietDuongSu
    });

    let nkkList = (don.chiTietDuongSu || []).filter(d => {
      let tcLower = String(d.tuCach || "").toLowerCase();
      return tcLower.includes('khởi kiện') || tcLower.includes('yêu cầu') || tcLower.includes('nguyên đơn');
    });

    if (nkkList.length > 0 && nkkList[0].sdt) {
      let phone = window.local_formatPhoneNumber(nkkList[0].sdt);
      let name = nkkList[0].hoTen;
      let dateVnFormat = date.split('-').reverse().join('/');

      let msg = template.replace(/\[TenDuongSu\]/g, window.removeAccents ? window.removeAccents(name) : name)
                        .replace(/\[SoDon\]/g, don.soDon)
                        .replace(/\[NgayNhan\]/g, don.ngayNhan)
                        .replace(/\[NgayHen\]/g, dateVnFormat)
                        .replace(/\[GioHen\]/g, time)
                        .replace(/\[DiaDiem\]/g, window.removeAccents ? window.removeAccents(loc) : loc);

      let linkSms = "sms:" + phone + "?body=" + encodeURIComponent(msg);

      buttonsHtml += `<a href="${linkSms}" target="_top" class="btn btn-outline-success btn-sm w-100 mb-2 d-flex justify-content-between align-items-center" onclick="this.classList.replace('btn-outline-success', 'btn-secondary')">
                        <span><i class="fas fa-sms me-2"></i>Gửi ${name}</span>
                        <span class="badge bg-success">${phone}</span>
                      </a>`;
    }
  });

  payloadsForServer.forEach(p => {
    let idx = G_Don.findIndex(d => d.id === p.info.id);
    if (idx > -1) G_Don[idx].trangThai = "Đã hẹn làm việc";
  });
  window.runFilterDonEngine();

  google.script.run.api_LuuNhieuDon_Bulk(payloadsForServer);
  google.script.run.api_LuuLichMoi_Logic({ idVuAn: "GENERAL", ngay: date, gio: time, noiDung: lichContent });

  setTimeout(() => {
    AppUI.hideToast();
    AppUI.alert("Hoàn tất Lưu Lịch!", "Đã cập nhật trạng thái đơn. Bấm vào các nút dưới đây để mở ứng dụng gửi tin nhắn cho từng người:<br><br><div style='max-height: 250px; overflow-y:auto; padding-right: 5px;'>" + buttonsHtml + "</div>");
  }, 2000);
};

window.openQuickEditDon = function(idDon) {
  let don = typeof G_Don !== 'undefined' ? G_Don.find(d => d.id === idDon) : null;
  if (!don) return;

  document.getElementById('quick_don_id').value = idDon;
  document.getElementById('quick_don_so').value = don.soDon || "";
  document.getElementById('quick_don_ngay').value = window.formatDateToYMD(don.rawDate);
  document.getElementById('quick_don_trangThai').value = don.trangThai || "Chưa xử lý";
  document.getElementById('quick_don_thamPhan').value = don.thamPhan || "";

  let loaiAnEl = document.getElementById('quick_don_loaiAn');
  if (loaiAnEl) {
    loaiAnEl.value = don.loaiAn || "2. Dân sự";
    window.updateQuickQuanHeDatalist();
  }
  document.getElementById('quick_don_quanHe').value = don.quanHe || "";

  ['nkk', 'nbk', 'nlq'].forEach(t => { 
    let el = document.getElementById('quick-party-' + t); 
    if (el) el.innerHTML = ""; 
  });

  if (don.chiTietDuongSu && don.chiTietDuongSu.length > 0) {
    don.chiTietDuongSu.forEach(d => {
      let tc = String(d.tuCach || "").toLowerCase();
      if (tc.includes('khởi kiện') || tc.includes('yêu cầu') || tc.includes('nguyên đơn')) {
        window.addQuickPartyRow('NKK', d);

      }
    });

  let nkkList = document.getElementById('quick-party-nkk');

  bootstrap.Modal.getOrCreateInstance(document.getElementById('modalQuickEditDon')).show();

window.addQuickPartyRow = function(type, dData = null) {
  let container = document.getElementById('quick-party-' + type.toLowerCase());
  if (!container) return;

  let tcMap = {'NKK': 'Người khởi kiện', 'NBK': 'Người bị kiện', 'NLQ': 'Người có quyền lợi, nghĩa vụ liên quan'};
  let tc = tcMap[type] || 'Người khởi kiện';

  var xhVal = dData ? (dData.xungHo || 'Ông/Bà') : 'Ông/Bà';
  var hoTen = dData ? (dData.hoTen || '') : '';
  var namSinh = dData ? (dData.namSinh || '') : '';
  var diaChi = dData ? (dData.diaChi || '') : '';

  var selOng = xhVal === 'Ông' ? 'selected' : '';
  var selBa = xhVal === 'Bà' ? 'selected' : '';
  var selTc = xhVal === 'Tổ chức' ? 'selected' : '';
  var selOngBa = xhVal === 'Ông/Bà' ? 'selected' : '';

  var html = `
  <div class="row g-2 q-party-item position-relative mb-2 pb-2 border-bottom">
    <input type="hidden" class="q-in-tucach" value="${tc}">
    <div class="col-3"><select class="form-select form-select-sm q-in-xungho"><option value='Ông/Bà' ${selOngBa}>Ông/Bà</option><option value='Ông' ${selOng}>Ông</option><option value='Bà' ${selBa}>Bà</option><option value='Tổ chức' ${selTc}>Tổ chức</option></select></div>
    <div class="col-6"><input type="text" class="form-control form-control-sm fw-bold q-in-hoten" placeholder="Họ và tên..." value="${hoTen}"></div>
    <div class="col-3"><input type="text" class="form-control form-control-sm q-in-namsinh" placeholder="Năm sinh" value="${namSinh}"></div>
    <div class="col-12"><input type="text" class="form-control form-control-sm q-in-diachi" placeholder="Địa chỉ..." value="${diaChi}"></div>
    <button class="btn btn-sm text-danger position-absolute" style="right:-10px; top:-5px; box-shadow:none;" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>
  </div>`;

  var div = document.createElement('div');
  div.innerHTML = html;
  container.appendChild(div.firstElementChild);
};

window.saveQuickEditDon = function(openDraftModal) {
  var p = {
    info: {
      id: document.getElementById('quick_don_id').value,
      soDon: document.getElementById('quick_don_so').value.trim(),
      ngayNhan: document.getElementById('quick_don_ngay').value,
      loaiAn: document.getElementById('quick_don_loaiAn').value,
      quanHe: document.getElementById('quick_don_quanHe').value.trim(),
      thamPhan: document.getElementById('quick_don_thamPhan').value.trim(),
      huongXuLy: document.getElementById('quick_don_trangThai').value,
      trangThai: document.getElementById('quick_don_trangThai').value,
      ghiChu: ""
    },
    ds: []
  };

  let donRAM = G_Don.find(d => d.id === p.info.id);
  if (donRAM) p.info.ghiChu = donRAM.ghiChu;

  let oldDsMap = {};
  if (donRAM && donRAM.chiTietDuongSu) {
    donRAM.chiTietDuongSu.forEach(d => {
      oldDsMap[d.hoTen + "_" + d.tuCach] = d.daiDien || "";
    });
  }

  var nkkArr = [], nbkArr = [];
  document.querySelectorAll('.q-party-item').forEach(m => {
    var hoTen = m.querySelector('.q-in-hoten').value.trim();
    if (hoTen) {
      var tuCach = m.querySelector('.q-in-tucach').value;
      var xungHo = m.querySelector('.q-in-xungho').value;
      var namSinh = m.querySelector('.q-in-namsinh').value.trim();
      var diaChi = m.querySelector('.q-in-diachi').value.trim();

      let tcLower = String(tuCach).toLowerCase();
      if (tcLower.includes('khởi kiện') || tcLower.includes('yêu cầu') || tcLower.includes('nguyên đơn')) nkkArr.push(hoTen);
      else if (!tcLower.includes('liên quan')) nbkArr.push(hoTen);

      let daiDienCu = oldDsMap[hoTen + "_" + tuCach] || "";
      p.ds.push({ tuCach: tuCach, xungHo: xungHo, hoTen: hoTen, namSinh: namSinh, diaChi: diaChi, sdt: "", cccd: "", daiDien: daiDienCu });
    }
  });

  let warningMsg = window.validateDonData(p.ds);
  
  const proceedQuickSave = function() {
    var dParts = p.info.ngayNhan.split('-');
    var dateVn = dParts.length === 3 ? (dParts[2] + "/" + dParts[1] + "/" + dParts[0]) : p.info.ngayNhan;
    var rawDateTs = new Date(p.info.ngayNhan).getTime();

    let index = G_Don.findIndex(function(d) { return d.id === p.info.id; });
    if (index > -1) {
      G_Don[index].soDon = p.info.soDon; G_Don[index].ngayNhan = dateVn; G_Don[index].rawDate = rawDateTs;
      G_Don[index].loaiAn = p.info.loaiAn; G_Don[index].quanHe = p.info.quanHe; G_Don[index].thamPhan = p.info.thamPhan;
      G_Don[index].huongXuLy = p.info.huongXuLy; G_Don[index].trangThai = p.info.trangThai;
      G_Don[index].nguoiKhoiKien = nkkArr.join(", "); G_Don[index].nguoiBiKien = nbkArr.join(", "); G_Don[index].chiTietDuongSu = p.ds;
    }

    google.script.run.api_LuuThongTinDon(p);
    window.runFilterDonEngine();

    let m = bootstrap.Modal.getInstance(document.getElementById('modalQuickEditDon'));
    if (m) m.hide();

    if (openDraftModal) {
      setTimeout(() => window.openQuickDraftDon(p.info.id), 400);
    }
  };

  if (warningMsg) AppUI.confirm("Thiếu thông tin", warningMsg, "warning", proceedQuickSave);
  else proceedQuickSave();
};

window.openQuickDraftDon = function(idDon) {
  let don = typeof G_Don !== 'undefined' ? G_Don.find(d => d.id === idDon) : null;
  if (!don) return;

  document.getElementById('draft_don_id').value = idDon;
  document.getElementById('draft_top_title').innerText = `Số đơn: ${don.soDon} - Ngày nhận: ${don.ngayNhan}`;
  document.getElementById('draft_top_quanHe').innerText = `Quan hệ tranh chấp: ${don.quanHe}`;

  let loaiAnEl = document.getElementById('draft_don_loaiAn');
  loaiAnEl.innerHTML = "";
  Object.keys(DICT_QUAN_HE).forEach(k => loaiAnEl.appendChild(new Option(k, k)));
  loaiAnEl.value = don.loaiAn || "2. Dân sự";
  document.getElementById('draft_don_quanHe').value = don.quanHe || "";

  document.getElementById('draft_don_giaTri').value = don.giaTri ? String(don.giaTri).replace(/\B(?=(\d{3})+(?!\d))/g, ".") : "";

  var key = "danSu";
  if (don.loaiAn.includes("Kinh doanh")) key = "kinhDoanh"; else if (don.loaiAn.includes("Hình sự")) key = "hinhSu"; else if (don.loaiAn.includes("Hành chính")) key = "hanhChinh";
  var feeObj = window.local_calculateCourtFee(key, String(don.giaTri || "0"));
  document.getElementById('draft_lbl_anPhi').innerText = feeObj.anPhiSo;
  document.getElementById('draft_lbl_tamUng').innerText = feeObj.tamUngSo;

  document.getElementById('draft_don_ngayBanHanh').value = window.formatDateToYMD();

  let nkkStr = "", nbkStr = "", nlqStr = "";
  if (don.chiTietDuongSu) {
    let groupsNKK = [], groupsNBK = [], groupsNLQ = [];
    don.chiTietDuongSu.forEach(d => {
      let roleLower = String(d.tuCach || "").toLowerCase();
      let type = '';
      if (roleLower.includes('khởi kiện') || roleLower.includes('yêu cầu') || roleLower.includes('bị hại') || roleLower.includes('nguyên đơn')) type = 'NKK';
      else if (roleLower.includes('liên quan')) type = 'NLQ';
      else type = 'NBK';

      let targetGroup = type === 'NKK' ? groupsNKK : (type === 'NLQ' ? groupsNLQ : groupsNBK);
      let addrKey = (d.diaChi || "").trim().toLowerCase();
      let found = addrKey ? targetGroup.find(g => (g.diaChi || "").trim().toLowerCase() === addrKey) : null;
      if (found) {
        found.members.push(d);
      } else {
        targetGroup.push({ diaChi: (d.diaChi || "").trim(), sdt: d.sdt || "", members: [d] });
      }
    });

    nkkStr = groupsNKK.map(g => window.buildSmartPartyString([g], false)).join('<hr class="my-1">');
    nbkStr = groupsNBK.map(g => window.buildSmartPartyString([g], false)).join('<hr class="my-1">');
    nlqStr = groupsNLQ.map(g => window.buildSmartPartyString([g], false)).join('<hr class="my-1">');
  }

  document.getElementById('draft_top_nkk').innerHTML = nkkStr || "Chưa có thông tin";
  document.getElementById('draft_top_nbk').innerHTML = nbkStr || "Chưa có thông tin";
  document.getElementById('draft_top_nlq').innerHTML = nlqStr || "Chưa có thông tin";

  let c = document.getElementById('quick_draft_templates');
  c.innerHTML = '<div class="text-center text-primary"><div class="spinner-border spinner-border-sm mt-3"></div></div>';

  bootstrap.Modal.getOrCreateInstance(document.getElementById('modalQuickDraftDon')).show();

  google.script.run.withSuccessHandler(ts => {
    if (!ts || !ts.length) { c.innerHTML = '<p class="text-danger">Chưa có biểu mẫu.</p>'; return; }
    c.innerHTML = ts.map(t => `<div class='form-check mb-1'><input class='form-check-input q-tpl-check shadow-sm' type='checkbox' value='${t.id}' id='q_tpl_${t.id}'><label class='form-check-label fw-bold text-dark' for='q_tpl_${t.id}' style='cursor:pointer;'>${t.name}</label></div>`).join('');
  }).api_GetBieuMauDon();
};

window.recalcDraftFee = function() {
  var loaiAn = document.getElementById('draft_don_loaiAn').value;
  var giaTriRaw = document.getElementById('draft_don_giaTri').value;
  var key = "danSu";
  if (loaiAn.includes("Kinh doanh")) key = "kinhDoanh"; else if (loaiAn.includes("Hình sự")) key = "hinhSu"; else if (loaiAn.includes("Hành chính")) key = "hanhChinh";

  var feeObj = window.local_calculateCourtFee(key, String(giaTriRaw));
  document.getElementById('draft_lbl_anPhi').innerText = feeObj.anPhiSo;
  document.getElementById('draft_lbl_tamUng').innerText = feeObj.tamUngSo;
};

window.executeQuickDraftDon = function() {
  var id = document.getElementById('draft_don_id').value;
  var st = [], templateNames = [];
  document.querySelectorAll('.q-tpl-check:checked').forEach(cb => {
    st.push(cb.value);
    templateNames.push(cb.nextElementSibling.innerText.toLowerCase());
  });

  if (!st.length) return AppUI.alert("Nhắc nhở", "Vui lòng chọn ít nhất một Biểu mẫu!");

  let isSbsRequired = templateNames.some(n => n.includes("sửa chữa") || n.includes("bổ sung") || n.includes("sửa đổi"));
  if (isSbsRequired) {
    window.pendingSBS_Data = { templateIds: st, templateNames: templateNames, idDon: id, isFromQuickModal: true };
    bootstrap.Modal.getOrCreateInstance(document.getElementById('modalSuaDoiBoSungDon')).show();
    window.toggleSbsFields();
  } else {
    window.finalizeDraftingLogic(st, templateNames, id, true);
  }
};

    },

  };

  if (!p.info.soDon) return AppUI.alert("Cảnh báo", "Vui lòng nhập Số đơn!");

  let oldDsMap = {};

    let donHienTai = G_Don.find(d => d.id === p.info.id);

      });

        let daiDienCu = oldDsMap[hoTen + "_" + tuCach] || "";

        p.ds.push({
          tuCach: tuCach, xungHo: xungHo, hoTen: hoTen, namSinh: namSinh, diaChi: diaChi, sdt: sdt, cccd: cccd, daiDien: daiDienCu
        });
      }
    });
  });

  let warningMsg = window.validateDonData(p.ds);

  const proceedMerge = function() {
    var dParts = p.info.ngayNhan.split('-');
    var dateVn = dParts.length === 3 ? (dParts[2] + "/" + dParts[1] + "/" + dParts[0]) : p.info.ngayNhan;
    var rawDateTs = new Date(p.info.ngayNhan).getTime();

    if (p.info.id && typeof G_Don !== 'undefined') {
      let index = G_Don.findIndex(function(d) { return d.id === p.info.id; });
      if (index > -1) {
        G_Don[index].soDon = p.info.soDon; G_Don[index].ngayNhan = dateVn; G_Don[index].rawDate = rawDateTs;
        G_Don[index].loaiAn = p.info.loaiAn; G_Don[index].quanHe = p.info.quanHe; G_Don[index].thamPhan = p.info.thamPhan;
        G_Don[index].huongXuLy = p.info.huongXuLy; G_Don[index].trangThai = p.info.trangThai; G_Don[index].giaTri = p.info.giaTri; G_Don[index].tamUng = p.info.tamUng; G_Don[index].ghiChu = p.info.ghiChu;
        G_Don[index].nguoiKhoiKien = nkkArr.join(", "); G_Don[index].nguoiBiKien = nbkArr.join(", "); G_Don[index].chiTietDuongSu = p.ds;
      }
    } else {
      p.info.id = "TEMP_" + new Date().getTime(); document.getElementById('don_id').value = p.info.id;
      G_Don.unshift({
        id: p.info.id, soDon: p.info.soDon, ngayNhan: dateVn, rawDate: rawDateTs,
        loaiAn: p.info.loaiAn, quanHe: p.info.quanHe, thamPhan: p.info.thamPhan, huongXuLy: p.info.huongXuLy, trangThai: p.info.trangThai,
        giaTri: p.info.giaTri, tamUng: p.info.tamUng, ghiChu: p.info.ghiChu, nguoiKhoiKien: nkkArr.join(", "), nguoiBiKien: nbkArr.join(", "), chiTietDuongSu: p.ds
      });
    }
    window.runFilterDonEngine();

    window.prepareDraftingLogicForDetail(selectedTemplates, p.info.id);
  };

  if (warningMsg) AppUI.confirm("Thiếu thông tin", warningMsg, "warning", proceedMerge);
  else proceedMerge();
};

window.prepareDraftingLogicForDetail = function(templateIds, idDonFromUI) {
  var templateNames = [];
  templateIds.forEach(idTpl => {
    let el = document.getElementById('tpl_don_' + idTpl);
    if (el) templateNames.push(el.nextElementSibling.innerText.toLowerCase());
  });

  let isSbsRequired = templateNames.some(n => n.includes("sửa chữa") || n.includes("bổ sung") || n.includes("sửa đổi"));

  if (isSbsRequired) {
    window.pendingSBS_Data = { templateIds: templateIds, templateNames: templateNames, idDon: idDonFromUI, isFromQuickModal: false };
    bootstrap.Modal.getOrCreateInstance(document.getElementById('modalSuaDoiBoSungDon')).show();
    window.toggleSbsFields();
  } else {
    window.finalizeDraftingLogic(templateIds, templateNames, idDonFromUI, false);
  }
};

window.buildBlockType1 = function(parties) {
  if (!parties || parties.length === 0) return "...........................";
  return parties.map(function(ds, i) {
    var ns = (ds.namSinh && ds.xungHo !== "Tổ chức") ? (", sinh năm " + ds.namSinh) : "";
    var xh = String(ds.xungHo || "").trim();
    if (!xh || xh === "Ông/Bà") xh = "Ông/bà ";
    else if (xh !== "Tổ chức") xh = xh.charAt(0).toUpperCase() + xh.slice(1).toLowerCase() + " ";
    else xh = "";
    return (i + 1) + ". " + xh + String(ds.hoTen || "").trim() + ns + ", địa chỉ: " + (ds.diaChi || "...") + "; là " + ds.tuCach + ";";
  }).join("\n");
};

window.buildBlockType2 = function(parties) {
  if (!parties || parties.length === 0) return "...........................";
  var groups = parties.reduce(function(acc, ds) { acc[ds.tuCach] = acc[ds.tuCach] || []; acc[ds.tuCach].push(ds); return acc; }, {});
  var result = []; var mIdx = 1;
  for (var role in groups) {
    result.push(mIdx + ". " + role + ":");
    groups[role].forEach(function(ds) {
      var ns = (ds.namSinh && ds.xungHo !== "Tổ chức") ? (", sinh năm " + ds.namSinh) : "";
      var xh = String(ds.xungHo || "").trim();
      if (!xh || xh === "Ông/Bà") xh = "Ông/bà ";
      else if (xh !== "Tổ chức") xh = xh.charAt(0).toUpperCase() + xh.slice(1).toLowerCase() + " ";
      else xh = "";
      result.push(" - " + xh + String(ds.hoTen || "").trim() + ns + "; địa chỉ: " + (ds.diaChi || "...") + ";");
    });
    mIdx++;
  }
  return result.join("\n");
};

window.finalizeDraftingLogic = function(templateIds, templateNames, idDon, isFromQuickModal, phSbsVanDe = "", phSbsYeuCau = "") {

  let taskId = "task_merge_" + new Date().getTime();
  AppUI.addBackgroundTask(taskId, `Đang xử lý đơn: ${don.soDon || 'Chưa có số'}`);

  try {
    let pDate, tDate, tTime, giaTriRaw, currentStatus, donQuanHeVal, donLoaiAnVal;

    if (isFromQuickModal) {
      pDate = document.getElementById('draft_don_ngayBanHanh').value || window.formatDateToYMD();
      tDate = document.getElementById('draft_don_date').value;
      tTime = document.getElementById('draft_don_time').value;
      giaTriRaw = document.getElementById('draft_don_giaTri').value;
      currentStatus = document.getElementById('quick_don_trangThai') ? document.getElementById('quick_don_trangThai').value : "Đang xem xét";
      donQuanHeVal = document.getElementById('draft_don_quanHe').value.trim();
      donLoaiAnVal = document.getElementById('draft_don_loaiAn').value;
    } else {
      pDate = document.getElementById('don_process_ngayBanHanh').value || window.formatDateToYMD();
      tDate = document.getElementById('don_process_date').value;
      tTime = document.getElementById('don_process_time').value;
      giaTriRaw = document.getElementById('don_giaTri').value;
      currentStatus = document.getElementById('don_trangThai_display') ? document.getElementById('don_trangThai_display').value : "Đang xem xét";
      donQuanHeVal = document.getElementById('don_quanHe').value.trim();
      donLoaiAnVal = document.getElementById('don_loaiAn').value;
    }

    let joinedNames = templateNames.join(" ").toLowerCase();
    let newStatus = currentStatus;
    let isSmsSent = (currentStatus === "Đã hẹn làm việc" || currentStatus === "SMS - Hướng dẫn" || currentStatus.includes("SMS"));
    let isChiHuongDan = templateNames.every(n => n.includes("nhận đơn") || n.includes("lựa chọn hòa giải") || n.includes("sửa chữa") || n.includes("bổ sung") || n.includes("sửa đổi"));

    if (isSmsSent && isChiHuongDan) newStatus = "SMS - Hướng dẫn";
    else if (joinedNames.includes("nộp tạm ứng") || joinedNames.includes("miễn tạm ứng") || joinedNames.includes("tạm ứng lệ phí")) newStatus = isSmsSent ? "Đã xử lý xong + SMS" : "Đã xử lý xong";
    else if (joinedNames.includes("chuyển vụ việc sang hòa giải") || joinedNames.includes("chỉ định hòa giải viên")) newStatus = "Chuyển hòa giải đối thoại";
    else if (joinedNames.includes("lựa chọn hòa giải")) newStatus = "Thông báo lựa chọn hòa giải";
    else if (joinedNames.includes("báo xử lý đơn")) newStatus = "Báo xử lý đơn";
    else if (joinedNames.includes("sửa chữa") || joinedNames.includes("bổ sung") || joinedNames.includes("sửa đổi")) newStatus = "Yêu cầu sửa đổi, bổ sung";
    else if (joinedNames.includes("trả lại")) newStatus = "Trả lại đơn";
    else if (joinedNames.includes("chuyển đơn")) newStatus = "Chuyển đơn";

    let cleanNo = don.soDon ? String(don.soDon).split('/')[0].trim() : "";
    let safeNgayNhanYMD = "";
    if (don.ngayNhan && String(don.ngayNhan).includes('/')) {
      let parts = String(don.ngayNhan).split('/');
      safeNgayNhanYMD = parts[2] + "-" + parts[1] + "-" + parts[0];
    } else if (don.rawDate) { 
      safeNgayNhanYMD = window.formatDateToYMD(don.rawDate); 
    } else { 
      safeNgayNhanYMD = window.formatDateToYMD(); 
    }

    let giaTri = String(giaTriRaw).replace(/\./g, '');
    let keyLoaiAn = "danSu";
    if (String(donLoaiAnVal).includes("Kinh doanh")) keyLoaiAn = "kinhDoanh";
    else if (String(donLoaiAnVal).includes("Hình sự")) keyLoaiAn = "hinhSu";
    else if (String(donLoaiAnVal).includes("Hành chính")) keyLoaiAn = "hanhChinh";

    let feeObj = window.local_calculateCourtFee(keyLoaiAn, giaTri || "0");
    let tamUngSo = String(feeObj.tamUngSo).replace(/\./g, '');

    var ph = {
      "{Ngày ban hành}": window.local_toVNText(pDate, false),
      "{Số đơn}": don.soDon, 
      "{Số thụ lý rút gọn}": cleanNo,
      "{Ngày nhận đơn}": window.local_toVNText(safeNgayNhanYMD, false), 
      "{Phân loại đơn}": String(donLoaiAnVal).split('. ')[1] || donLoaiAnVal,
      "{Quan hệ tranh chấp}": donQuanHeVal, 
      "{quan hệ tranh chấp}": donQuanHeVal, 
      "{Những vấn đề cần sửa chữa bổ sung}": phSbsVanDe, 
      "{Yêu cầu sửa đổi bổ sung}": phSbsYeuCau,
      "{Tạm ứng án phí bằng số}": `${feeObj.tamUngSo} đồng`, 
      "{Tạm ứng án phí bằng chữ}": `${feeObj.tamUngChu}`,
      "{Án phí bằng số}": `${feeObj.anPhiSo} đồng`, 
      "{Án phí bằng chữ}": `${feeObj.anPhiChu}`
    };

    if (tDate) { 
      ph["{Thời gian triệu tập}"] = window.local_fmtFullTime(tDate, tTime); 
      ph["{Địa điểm}"] = "Trụ sở Tòa án"; 
    } else { 
      ph["{Thời gian triệu tập}"] = ".......giờ.......phút, ngày.......tháng.......năm......."; 
      ph["{Địa điểm}"] = "......................................................."; 
    }

    // CHUẨN HÓA: Gom nhóm CÙNG ĐỊA CHỈ chỉ dựa vào trường địa chỉ
    let groupsNKK = [], groupsNBK = [], groupsNLQ = [];
    let firstNKK = "Chưa rõ";

    (don.chiTietDuongSu || []).forEach(d => {
      let roleLower = String(d.tuCach || "").toLowerCase();
      let type = '';
      if (roleLower.includes('khởi kiện') || roleLower.includes('yêu cầu') || roleLower.includes('bị hại') || roleLower.includes('nguyên đơn')) {
        type = 'NKK'; if (firstNKK === 'Chưa rõ') firstNKK = d.hoTen;
      } else if (roleLower.includes('liên quan')) {
        type = 'NLQ';
      } else {
        type = 'NBK';
      }

      let targetGroup = type === 'NKK' ? groupsNKK : (type === 'NLQ' ? groupsNLQ : groupsNBK);
      let addrKey = (d.diaChi || "").trim().toLowerCase();
      let found = addrKey ? targetGroup.find(g => (g.diaChi || "").trim().toLowerCase() === addrKey) : null;
      if (found) {
        found.members.push(d);
      } else {
        targetGroup.push({ diaChi: (d.diaChi || "").trim(), sdt: d.sdt || "", members: [d] });
      }
    });

    // Tách bạch danh xưng, tên mộc và cụm gộp vào ph
    ["Nguyên đơn", "Người khởi kiện", "Người yêu cầu", "Người nộp đơn", "Người bị hại"].forEach(k => window.buildExactPlaceholders(ph, k, groupsNKK));
    ["Bị đơn", "Người bị kiện", "Người bị yêu cầu", "Bị cáo"].forEach(k => window.buildExactPlaceholders(ph, k, groupsNBK));
    ["Người có quyền lợi, nghĩa vụ liên quan"].forEach(k => window.buildExactPlaceholders(ph, k, groupsNLQ));

    ph["{Nguyên đơn}"] = ph["{Người khởi kiện}"] = ph["{Người yêu cầu}"] = ph["{Người nộp đơn}"] = window.buildShortPartyString(groupsNKK, false);
    ph["{Bị đơn}"] = ph["{Người bị kiện}"] = ph["{Người bị yêu cầu}"] = window.buildShortPartyString(groupsNBK, false);
    ph["{Người có quyền lợi, nghĩa vụ liên quan}"] = window.buildShortPartyString(groupsNLQ, false);
    
    ph["{nguyên đơn}"] = ph["{người khởi kiện}"] = ph["{người yêu cầu}"] = ph["{người nộp đơn}"] = window.buildShortPartyString(groupsNKK, true);
    ph["{bị đơn}"] = ph["{người bị kiện}"] = ph["{người bị yêu cầu}"] = window.buildShortPartyString(groupsNBK, true);
    ph["{người có quyền lợi, nghĩa vụ liên quan}"] = window.buildShortPartyString(groupsNLQ, true);

    ph["{Nguyên đơn chi tiết}"] = ph["{Người khởi kiện chi tiết}"] = ph["{Người yêu cầu chi tiết}"] = window.buildSmartPartyString(groupsNKK, false);

    ph["{Người có quyền lợi, nghĩa vụ liên quan chi tiết}"] = window.buildSmartPartyString(groupsNLQ, false);

    ph["{người có quyền lợi, nghĩa vụ liên quan chi tiết}"] = window.buildSmartPartyString(groupsNLQ, true);

    ph["{Đương sự thông báo}"] = window.buildBlockType1(don.chiTietDuongSu);

        giaTri: giaTri, tamUng: tamUngSo, huongXuLy: newStatus

    let idToKeep = payloadData.info.id; 
    
    google.script.run

          AppUI.completeBackgroundTask(taskId, true, linksHtml);
          
          if (res.idDon && String(res.idDon).startsWith("DON_")) {
            let currentUiId = document.getElementById('don_id').value;
            if (currentUiId === idToKeep) { document.getElementById('don_id').value = res.idDon; }
            let tmpIndex = G_Don.findIndex(function(d) { return d.id === idToKeep; });
            if (tmpIndex > -1) G_Don[tmpIndex].id = res.idDon;
          }
        } else { 
          let errMsg = res && res.error ? res.error : "Máy chủ trả về kết quả rỗng.";
          AppUI.completeBackgroundTask(taskId, false, errMsg); 
        }
      })
      .withFailureHandler(function(err){
        unlockButtons(); 
        AppUI.completeBackgroundTask(taskId, false, "Lỗi kết nối mạng: " + err.message);
      })
      .api_LuuVaTronThuDon_SuperFast(payloadData, payloadMerge);

  } catch (error) {
    unlockButtons();
    AppUI.completeBackgroundTask(taskId, false, "Lỗi hệ thống Frontend: " + error.message);
    console.error(error);
  }
};

window.donAutoSaveTimer = null;

document.addEventListener("DOMContentLoaded", function() {
  document.addEventListener('input', handleDonAutoSave);
  document.addEventListener('change', handleDonAutoSave);
});

function handleDonAutoSave(e) {
  if (!e.target.closest('#view-chi-tiet-don')) return;

  if (e.target && (
    e.target.id === 'don_quick_search_no' || 
    e.target.type === 'file' || 
    e.target.type === 'checkbox' || 
    e.target.type === 'button' || 
    e.target.tagName === 'BUTTON' || 
    e.target.tagName === 'A'
  )) return;

  let currentId = document.getElementById('don_id').value;
  if (!currentId || currentId.includes("TEMP_")) return;

  clearTimeout(window.donAutoSaveTimer);
  
  let indicator = document.getElementById('don_autosave_indicator');
  if (indicator) indicator.innerHTML = '<i class="fas fa-spinner fa-spin text-warning me-1"></i> <span class="text-warning">Đang chờ lưu...</span>';

  window.donAutoSaveTimer = setTimeout(() => {
    if (typeof window.luuThongTinDon === 'function') {
      window.luuThongTinDon(true);
    }
  }, 1500);
}
